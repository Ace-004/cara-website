<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Slideshow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: #000;
    }

    .slideshow-container {
      width: 100%;
      max-width: 800px;
      height: 400px;
      margin: 40px auto;
      overflow: hidden;
      position: relative;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .slides {
      display: flex;
      width: 400%; /* 4 slides = 100% * 4 */
      height: 100%;
      animation: slide 16s infinite;
    }

    .slide {
      width: 100%;
      flex-shrink: 0;
      height: 100%;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes slide {
      0%    { transform: translateX(0%); }
      25%   { transform: translateX(-100%); }
      50%   { transform: translateX(-200%); }
      75%   { transform: translateX(-300%); }
      100%  { transform: translateX(0%); }
    }
  </style>
</head>
<body>

  <div class="slideshow-container">
    <div class="slides">
      <div class="slide"><img src="https://picsum.photos/id/1015/800/400" alt="Slide 1"></div>
      <div class="slide"><img src="https://picsum.photos/id/1016/800/400" alt="Slide 2"></div>
      <div class="slide"><img src="https://picsum.photos/id/1018/800/400" alt="Slide 3"></div>
      <div class="slide"><img src="https://picsum.photos/id/1020/800/400" alt="Slide 4"></div>
    </div>
  </div>

</body>
</html>
